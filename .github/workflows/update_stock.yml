name: 自動更新股票均線通道數據

on:
  schedule:
    # 台灣時間 09:00 到 13:30，每半小時執行一次 (UTC 01:00 ~ 05:30)
    - cron: '0,30 1-5 * * 1-5'
    # 台灣時間 14:00 收盤結算更新 (UTC 06:00)
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 介面上手動點擊按鈕觸發執行

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴庫
        run: |
          pip install --upgrade yfinance pandas requests

      - name: 執行 Python 數據抓取與計算
        run: |
          python fetch_and_calc.py

      - name: 自動提交並 Push 更新資料
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data.json
          git commit -m "Auto update stock channel data [skip ci]" || exit 0
          git push
