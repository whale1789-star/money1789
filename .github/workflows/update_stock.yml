name: 自動更新股票均線通道數據

on:
  schedule:
    # 每天 UTC 09:30 執行（相當於台灣時間 17:30 股市收盤後）
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 介面上手動按鈕觸發執行

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝依賴庫
        run: |
          pip install yfinance pandas

      - name: 執行 Python 數據抓取與計算
        run: |
          python fetch_and_calc.py

      - name: 自動提交並 Push 更新資料
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data.json
          git commit -m "Auto update stock channel data [skip ci]" || exit 0
          git push
