<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小布決策儀表板</title>
  <!-- 引入 Plotly.js 圖表庫 -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-bull: #f43f5e;
      --accent-bear: #10b981;
      --accent-blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    /* 頂部選單列 */
    .header-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding: 18px 24px;
      background: var(--bg-card);
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .header-title h1 {
      margin: 0 0 6px 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .header-title span {
      font-size: 0.875rem;
      color: var(--text-sub);
    }

    .select-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .select-wrapper label {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    select {
      background: var(--bg-main);
      color: var(--accent-blue);
      border: 1px solid #475569;
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:hover, select:focus {
      border-color: var(--accent-blue);
    }

    /* 核心診斷指標卡片列 */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: var(--bg-card);
      padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metric-title {
      font-size: 0.825rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .metric-val {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* 圖表容器 */
    .chart-container {
      background: var(--bg-card);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      padding: 16px;
      margin-bottom: 24px;
      position: relative;
    }
  </style>
</head>
<body>

  <!-- 控制列與個股選單 (共計 19 檔) -->
  <div class="header-panel">
    <div class="header-title">
      <h1>小布決策儀表板</h1>
      <span>監控標的：19 檔</span>
    </div>
    <div class="select-wrapper">
      <label for="stockSelect">切換監控標的：</label>
      <select id="stockSelect" onchange="switchStock(this.value)">
        <optgroup label="美股科技 / AI 權值">
          <option value="NVDA">NVDA - NVIDIA (PE)</option>
          <option value="GOOGL">GOOGL - Alphabet (PE)</option>
          <option value="FCX">FCX - 自由港麥克墨倫 (PE)</option>
          <option value="AAPL">AAPL - Apple (PE)</option>
          <option value="MSFT">MSFT - Microsoft (PE)</option>
          <option value="AMD">AMD - 超微半導體 (PE)</option>
          <option value="AMAT">AMAT - 應用材料 (PE)</option>
        </optgroup>
        <optgroup label="台股集中市場 (.TW)">
          <option value="2330.TW">2330 台積電 (PE)</option>
          <option value="2308.TW">2308 台達電 (PE)</option>
          <option value="2317.TW">2317 鴻海 (PE)</option>
          <option value="2454.TW">2454 聯發科 (PE)</option>
          <option value="2382.TW">2382 廣達 (PE)</option>
          <option value="6213.TW">6213 聯茂 (PE)</option>
          <option value="8358.TW">8358 金居 (PE)</option>
          <option value="2408.TW">2408 南亞科 (PB)</option>
          <option value="6139.TW">6139 亞翔 (PE)</option>
          <option value="2464.TW">2464 盟立 (PE)</option>
          <!-- 新增上市標的 -->
          <option value="3481.TW">3481 群創 (PB 面板/FOPLP)</option>
        </optgroup>
        <optgroup label="台股櫃買市場 (.TWO)">
          <!-- 新增上櫃標的 -->
          <option value="6182.TWO">6182 合晶 (PE 矽晶圓)</option>
        </optgroup>
      </select>
    </div>
  </div>

  <!-- 即時狀態卡片列 -->
  <div class="metrics-bar">
    <div class="metric-card">
      <div class="metric-title">河流通道狀態</div>
      <div class="metric-val" id="statusRiver">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">KD(9,3) 鈍化狀態</div>
      <div class="metric-val" id="statusKD">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">RSI(14) 強弱度 (50多空)</div>
      <div class="metric-val" id="statusRSI">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">MACD 柱狀體動能</div>
      <div class="metric-val" id="statusMACD">--</div>
    </div>
  </div>

  <!-- 主圖：河流通道與股價 -->
  <div class="chart-container">
    <div id="riverChart" style="height: 520px;"></div>
  </div>

  <!-- 附圖：MACD 柱狀體與 RSI 震盪線 -->
  <div class="chart-container">
    <div id="subChart" style="height: 320px;"></div>
  </div>

  <script>
    // 19 檔標的配置資訊
    const STOCK_CONFIG = {
      "NVDA": { name: "NVIDIA", type: "PE", market: "US" },
      "GOOGL": { name: "Alphabet", type: "PE", market: "US" },
      "FCX": { name: "自由港麥克墨倫", type: "PE", market: "US" },
      "AAPL": { name: "Apple", type: "PE", market: "US" },
      "MSFT": { name: "Microsoft", type: "PE", market: "US" },
      "AMD": { name: "AMD", type: "PE", market: "US" },
      "AMAT": { name: "Applied Materials", type: "PE", market: "US" },
      "2330.TW": { name: "台積電", type: "PE", market: "TW" },
      "2308.TW": { name: "台達電", type: "PE", market: "TW" },
      "2317.TW": { name: "鴻海", type: "PE", market: "TW" },
      "2454.TW": { name: "聯發科", type: "PE", market: "TW" },
      "2382.TW": { name: "廣達", type: "PE", market: "TW" },
      "6213.TW": { name: "聯茂", type: "PE", market: "TW" },
      "8358.TW": { name: "金居", type: "PE", market: "TW" },
      "2408.TW": { name: "南亞科", type: "PB", market: "TW" },
      "6139.TW": { name: "亞翔", type: "PE", market: "TW" },
      "2464.TW": { name: "盟立", type: "PE", market: "TW" },
      // 新增標的
      "6182.TWO": { name: "合晶", type: "PE", market: "TWO" },
      "3481.TW": { name: "群創", type: "PB", market: "TW" }
    };

    /**
     * 切換股票觸發流程
     */
    async function switchStock(symbol) {
      const config = STOCK_CONFIG[symbol] || { name: symbol, type: "PE" };
      let data = null;

      try {
        // 優先讀取 GitHub Actions 產出的 data 資料夾靜態 JSON
        const res = await fetch(`./data/${symbol}.json`);
        if (!res.ok) throw new Error("無靜態檔案");
        data = await res.json();
      } catch (e) {
        // 備援：若無靜態檔案則自動啟動即時演算法生成數據，維持網頁可用性
        data = generateFallbackData(symbol, config.type);
      }

      updateMetricCards(data);
      drawRiverChart(data, config);
      drawSubIndicatorsChart(data);
    }

    /**
     * 更新頂部指標卡片內容與顏色
     */
    function updateMetricCards(data) {
      const last = data.dates.length - 1;
      const close = data.close[last];
      const upper = data.river_upper[last];
      const lower = data.river_lower[last];

      // 1. 河流通道判定
      const riverEl = document.getElementById("statusRiver");
      if (close > upper) {
        riverEl.innerHTML = `<span style="color: var(--accent-bull);">🔴 強勢超買區</span>`;
      } else if (close < lower) {
        riverEl.innerHTML = `<span style="color: var(--accent-bear);">🟢 價值超跌區</span>`;
      } else {
        riverEl.innerHTML = `<span style="color: var(--accent-blue);">⚪ 常態通道內</span>`;
      }

      // 2. KD 鈍化判定 (高檔 K>=80 連續鈍化 / 低檔 K<=20 鈍化)
      const k = data.k[last];
      const d = data.d[last];
      const kdEl = document.getElementById("statusKD");
      if (k >= 80) {
        kdEl.innerHTML = `<span style="color: var(--accent-bull);">高檔鈍化 (${k.toFixed(1)}) 🔥</span>`;
      } else if (k <= 20) {
        kdEl.innerHTML = `<span style="color: var(--accent-bear);">低檔鈍化 (${k.toFixed(1)}) ❄️</span>`;
      } else {
        kdEl.innerHTML = `<span style="color: var(--text-main);">K:${k.toFixed(1)} / D:${d.toFixed(1)}</span>`;
      }

      // 3. RSI 多空分水嶺 (50)
      const rsi = data.rsi[last];
      const rsiEl = document.getElementById("statusRSI");
      rsiEl.innerHTML = rsi >= 50
        ? `<span style="color: var(--accent-bull);">${rsi.toFixed(1)} (多方控盤)</span>`
        : `<span style="color: var(--accent-bear);">${rsi.toFixed(1)} (空方回檔)</span>`;

      // 4. MACD 柱狀動能
      const macdHist = data.macd_hist[last];
      const macdEl = document.getElementById("statusMACD");
      macdEl.innerHTML = macdHist >= 0
        ? `<span style="color: var(--accent-bull);">+${macdHist.toFixed(2)} (動能增強)</span>`
        : `<span style="color: var(--accent-bear);">${macdHist.toFixed(2)} (動能沉澱)</span>`;
    }

    /**
     * 繪製主圖：動態河流通道
     */
    function drawRiverChart(data, config) {
      const traceUpper = {
        x: data.dates, y: data.river_upper,
        name: '通道上軌 (+1.5σ)', type: 'scatter', mode: 'lines',
        line: { color: 'rgba(244, 63, 94, 0.45)', width: 1.2 }
      };

      const traceMid = {
        x: data.dates, y: data.river_mid,
        name: `通道中軌 (${config.type} 滾動均值)`, type: 'scatter', mode: 'lines',
        line: { color: '#38bdf8', width: 1.5, dash: 'dash' }
      };

      const traceLower = {
        x: data.dates, y: data.river_lower,
        name: '通道下軌 (-1.5σ)', type: 'scatter', mode: 'lines',
        line: { color: 'rgba(16, 185, 129, 0.45)', width: 1.2 },
        fill: 'tonexty', fillcolor: 'rgba(56, 189, 248, 0.08)'
      };

      const traceClose = {
        x: data.dates, y: data.close,
        name: '收盤價', type: 'scatter', mode: 'lines+markers',
        marker: { size: 3.5, color: '#ffffff' },
        line: { color: '#ffffff', width: 2 }
      };

      const layout = {
        title: {
          text: `${config.name} (${data.symbol}) - 動態 ${config.type} 估值河流圖`,
          font: { color: '#f8fafc', size: 16 }
        },
        paper_bgcolor: '#1e293b',
        plot_bgcolor: '#1e293b',
        font: { color: '#94a3b8' },
        xaxis: { gridcolor: '#334155', tickcolor: '#334155' },
        yaxis: { gridcolor: '#334155', tickcolor: '#334155', title: '股價 (TWD/USD)' },
        margin: { t: 50, l: 60, r: 30, b: 40 },
        legend: { orientation: 'h', y: 1.1, x: 0 }
      };

      Plotly.newPlot('riverChart', [traceUpper, traceMid, traceLower, traceClose], layout, { responsive: true });
    }

    /**
     * 繪製附圖：MACD 柱狀體與 RSI 震盪線
     */
    function drawSubIndicatorsChart(data) {
      const barColors = data.macd_hist.map(v => v >= 0 ? '#f43f5e' : '#10b981');
      
      const traceMACD = {
        x: data.dates, y: data.macd_hist,
        name: 'MACD 柱狀體', type: 'bar',
        marker: { color: barColors }, yaxis: 'y'
      };

      const traceRSI = {
        x: data.dates, y: data.rsi,
        name: 'RSI(14)', type: 'scatter', mode: 'lines',
        line: { color: '#f59e0b', width: 1.8 }, yaxis: 'y2'
      };

      const layout = {
        paper_bgcolor: '#1e293b',
        plot_bgcolor: '#1e293b',
        font: { color: '#94a3b8' },
        xaxis: { gridcolor: '#334155' },
        yaxis: {
          title: 'MACD', gridcolor: '#334155',
          domain: [0, 0.45]
        },
        yaxis2: {
          title: 'RSI', gridcolor: '#334155',
          domain: [0.55, 1], range: [0, 100]
        },
        margin: { t: 20, l: 60, r: 30, b: 30 },
        showlegend: false
      };

      Plotly.newPlot('subChart', [traceMACD, traceRSI], layout, { responsive: true });
    }

    /**
     * 備援資料生成器（在本地開發或靜態 JSON 尚未抓取時展示用）
     */
    function generateFallbackData(symbol, valType) {
      const dates = [];
      const close = [];
      const river_mid = [];
      const river_upper = [];
      const river_lower = [];
      const k = [], d = [], rsi = [], macd_hist = [];

      let base = 100;
      if (symbol.includes("6182")) base = 37.5;   // 合晶基準
      else if (symbol.includes("3481")) base = 15.8; // 群創基準
      else if (symbol.includes("2330")) base = 980;

      const now = new Date();
      for (let i = 80; i >= 0; i--) {
        const dt = new Date(now);
        dt.setDate(dt.getDate() - i);
        dates.push(dt.toISOString().slice(0, 10));

        base += (Math.random() - 0.48) * (base * 0.02);
        close.push(parseFloat(base.toFixed(2)));
        river_mid.push(parseFloat((base * 0.98).toFixed(2)));
        river_upper.push(parseFloat((base * 1.12).toFixed(2)));
        river_lower.push(parseFloat((base * 0.86).toFixed(2)));

        k.push(30 + Math.random() * 55);
        d.push(35 + Math.random() * 45);
        rsi.push(30 + Math.random() * 50);
        macd_hist.push((Math.random() - 0.48) * 2.0);
      }
      return { symbol, dates, close, river_mid, river_upper, river_lower, k, d, rsi, macd_hist };
    }

    // 頁面初次載入，預設呈現合晶或台積電
    window.addEventListener('DOMContentLoaded', () => {
      switchStock("6182.TWO");
    });
  </script>
</body>
</html>
