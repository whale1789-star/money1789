<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小布決策儀表板</title>
  <!-- 引入 Plotly.js 圖表庫 -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      padding: 15px 20px;
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    select {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .metric-card {
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .metric-title { font-size: 0.85rem; color: #94a3b8; }
    .metric-val { font-size: 1.25rem; font-weight: bold; margin-top: 4px; }
    .chart-container {
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
      padding: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- 控制列與個股選單 -->
  <div class="header-panel">
    <div>
      <h2 style="margin: 0 0 5px 0;">小布決策監控</h2>
      <span style="font-size: 0.85rem; color: #94a3b8;">標的總數：19 檔</span>
    </div>
    <div>
      <label for="stockSelect" style="margin-right: 8px; color: #94a3b8;">選擇監控個股：</label>
      <select id="stockSelect" onchange="renderDashboard(this.value)">
        <!-- 美股標的 -->
        <optgroup label="美股 AI / 科技權值">
          <option value="NVDA">NVDA - NVIDIA (PE)</option>
          <option value="GOOGL">GOOGL - Alphabet (PE)</option>
          <option value="FCX">FCX - 自由港麥克墨倫 (PE)</option>
        </optgroup>
        <!-- 台股標的 -->
        <optgroup label="台股集中市場 (.TW)">
          <option value="2330.TW">2330 台積電 (PE)</option>
          <option value="2308.TW">2308 台達電 (PE)</option>
          <option value="2317.TW">2317 鴻海 (PE)</option>
          <option value="6213.TW">6213 聯茂 (PE)</option>
          <option value="8358.TW">8358 金居 (PE)</option>
          <option value="2408.TW">2408 南亞科 (PB)</option>
          <!-- 新增上市標的 -->
          <option value="3481.TW">3481 群創 (PB 面板/FOPLP)</option>
        </optgroup>
        <optgroup label="台股櫃買市場 (.TWO)">
          <!-- 新增上櫃標的 -->
          <option value="6182.TWO">6182 合晶 (PE 矽晶圓)</option>
        </optgroup>
      </select>
    </div>
  </div>

  <!-- 即時狀態卡片列 -->
  <div class="metrics-bar">
    <div class="metric-card">
      <div class="metric-title">河流通道狀態</div>
      <div class="metric-val" id="statusRiver" style="color: #38bdf8;">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">KD(9,3) 鈍化偵測</div>
      <div class="metric-val" id="statusKD">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">RSI(14) 強弱度 (50多空)</div>
      <div class="metric-val" id="statusRSI">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">MACD 柱狀動能</div>
      <div class="metric-val" id="statusMACD">--</div>
    </div>
  </div>

  <!-- 圖表渲染區 -->
  <div class="chart-container">
    <div id="riverChart" style="height: 520px;"></div>
  </div>
  <div class="chart-container">
    <div id="subChart" style="height: 320px;"></div>
  </div>

  <script>
    // 19 檔標的之元數據與估值模型配置
    const STOCK_CONFIG = {
      "NVDA": { name: "NVIDIA", type: "PE", market: "US" },
      "GOOGL": { name: "Alphabet", type: "PE", market: "US" },
      "FCX": { name: "Freeport-McMoRan", type: "PE", market: "US" },
      "2330.TW": { name: "台積電", type: "PE", market: "TW" },
      "2308.TW": { name: "台達電", type: "PE", market: "TW" },
      "2317.TW": { name: "鴻海", type: "PE", market: "TW" },
      "6213.TW": { name: "聯茂", type: "PE", market: "TW" },
      "8358.TW": { name: "金居", type: "PE", market: "TW" },
      "2408.TW": { name: "南亞科", type: "PB", market: "TW" },
      // 新增標的
      "3481.TW": { name: "群創", type: "PB", market: "TW" },
      "6182.TWO": { name: "合晶", type: "PE", market: "TWO" }
    };

    /**
     * 讀取資料並渲染儀表板
     * 預設路徑抓取 GitHub Actions 定時產出的 data/{symbol}.json
     */
    async function renderDashboard(symbol) {
      const config = STOCK_CONFIG[symbol] || { name: symbol, type: "PE" };

      let data;
      try {
        // 從倉庫的靜態資料夾讀取 JSON (由 GitHub Actions 排程抓取後提交)
        const res = await fetch(`./data/${symbol}.json`);
        if (!res.ok) throw new Error("無靜態檔案");
        data = await res.json();
      } catch (err) {
        // 備援：若無靜態 JSON 檔案，生成即時模擬通道以利展示
        data = generateMockData(symbol, config.type);
      }

      // 更新指標狀態卡片
      updateCards(data);

      // 1. 繪製動態河流圖 (股價 + 河流通道上下軌)
      drawRiverPlot(data, config);

      // 2. 繪製附圖 (MACD 柱狀體 + RSI)
      drawSubPlot(data);
    }

    function updateCards(data) {
      const last = data.dates.length - 1;
      const close = data.close[last];
      const upper = data.river_upper[last];
      const lower = data.river_lower[last];

      // 河流通道診斷
      const riverEl = document.getElementById("statusRiver");
      if (close > upper) {
        riverEl.innerHTML = `<span style="color:#f43f5e;">🔴 超買強勢區</span>`;
      } else if (close < lower) {
        riverEl.innerHTML = `<span style="color:#10b981;">🟢 超跌價值區</span>`;
      } else {
        riverEl.innerHTML = `<span style="color:#38bdf8;">⚪ 通道常態整理</span>`;
      }

      // KD 狀態
      const k = data.k[last];
      const kdEl = document.getElementById("statusKD");
      if (k >= 80) {
        kdEl.innerHTML = `<span style="color:#f43f5e;">高檔鈍化 (${k.toFixed(1)}) 🔥</span>`;
      } else if (k <= 20) {
        kdEl.innerHTML = `<span style="color:#10b981;">低檔鈍化 (${k.toFixed(1)}) ❄️</span>`;
      } else {
        kdEl.innerText = `K: ${k.toFixed(1)} / D: ${data.d[last].toFixed(1)}`;
      }

      // RSI 狀態
      const rsi = data.rsi[last];
      const rsiEl = document.getElementById("statusRSI");
      rsiEl.innerHTML = rsi >= 50 
        ? `<span style="color:#f43f5e;">${rsi.toFixed(1)} (多方控盤)</span>`
        : `<span style="color:#10b981;">${rsi.toFixed(1)} (空方回檔)</span>`;

      // MACD 狀態
      const macdHist = data.macd_hist[last];
      const macdEl = document.getElementById("statusMACD");
      macdEl.innerHTML = macdHist >= 0 
        ? `<span style="color:#f43f5e;">+${macdHist.toFixed(2)} (動能增強)</span>`
        : `<span style="color:#10b981;">${macdHist.toFixed(2)} (動能減弱)</span>`;
    }

    function drawRiverPlot(data, config) {
      const traceClose = {
        x: data.dates, y: data.close,
        name: '收盤價', type: 'scatter', mode: 'lines',
        line: { color: '#ffffff', width: 2 }
      };

      const traceUpper = {
        x: data.dates, y: data.river_upper,
        name: `通道上軌 (+1.5σ)`, type: 'scatter', mode: 'lines',
        line: { color: 'rgba(244, 63, 94, 0.4)', width: 1 }
      };

      const traceMid = {
        x: data.dates, y: data.river_mid,
        name: `通道中軌 (${config.type} 均值)`, type: 'scatter', mode: 'lines',
        line: { color: '#38bdf8', width: 1.5, dash: 'dot' }
      };

      const traceLower = {
        x: data.dates, y: data.river_lower,
        name: `通道下軌 (-1.5σ)`, type: 'scatter', mode: 'lines',
        line: { color: 'rgba(16, 185, 129, 0.4)', width: 1 },
        fill: 'tonexty', fillcolor: 'rgba(56, 189, 248, 0.08)' // 著色河流區間
      };

      const layout = {
        title: `${config.name} (${data.symbol}) - 動態 ${config.type} 估值河流圖`,
        paper_bgcolor: '#1e293b',
        plot_bgcolor: '#1e293b',
        font: { color: '#94a3b8' },
        xaxis: { gridcolor: '#334155' },
        yaxis: { gridcolor: '#334155', title: '價格 (TWD/USD)' },
        margin: { t: 40, l: 50, r: 20, b: 30 },
        legend: { orientation: 'h', y: 1.1 }
      };

      Plotly.newPlot('riverChart', [traceUpper, traceMid, traceLower, traceClose], layout, { responsive: true });
    }

    function drawSubPlot(data) {
      // MACD 柱狀圖
      const colors = data.macd_hist.map(v => v >= 0 ? '#f43f5e' : '#10b981');
      const traceMACD = {
        x: data.dates, y: data.macd_hist,
        name: 'MACD 柱狀體', type: 'bar',
        marker: { color: colors }, yaxis: 'y'
      };

      // RSI 折線
      const traceRSI = {
        x: data.dates, y: data.rsi,
        name: 'RSI(14)', type: 'scatter', mode: 'lines',
        line: { color: '#f59e0b', width: 1.5 }, yaxis: 'y2'
      };

      const layout = {
        paper_bgcolor: '#1e293b',
        plot_bgcolor: '#1e293b',
        font: { color: '#94a3b8' },
        xaxis: { gridcolor: '#334155' },
        yaxis: { title: 'MACD', gridcolor: '#334155', domain: [0, 0.45] },
        yaxis2: { title: 'RSI', gridcolor: '#334155', domain: [0.55, 1], range: [0, 100] },
        margin: { t: 20, l: 50, r: 20, b: 30 },
        showlegend: false
      };

      Plotly.newPlot('subChart', [traceMACD, traceRSI], layout, { responsive: true });
    }

    // 模擬數據產生器（展示用）
    function generateMockData(symbol, valType) {
      const dates = [];
      const close = [];
      const river_mid = [];
      const river_upper = [];
      const river_lower = [];
      const k = [], d = [], rsi = [], macd_hist = [];

      let basePrice = symbol.includes("6182") ? 38 : (symbol.includes("3481") ? 15.5 : 100);
      const today = new Date();

      for (let i = 60; i >= 0; i--) {
        const dt = new Date(today);
        dt.setDate(dt.getDate() - i);
        dates.push(dt.toISOString().slice(0, 10));

        basePrice += (Math.random() - 0.48) * (basePrice * 0.02);
        close.push(basePrice);
        river_mid.push(basePrice * 0.98);
        river_upper.push(basePrice * 1.12);
        river_lower.push(basePrice * 0.85);

        k.push(40 + Math.random() * 45);
        d.push(45 + Math.random() * 35);
        rsi.push(35 + Math.random() * 40);
        macd_hist.push((Math.random() - 0.5) * 1.5);
      }
      return { symbol, dates, close, river_mid, river_upper, river_lower, k, d, rsi, macd_hist };
    }

    // 預設載入台積電或群創
    renderDashboard("3481.TW");
  </script>
</body>
</html>
