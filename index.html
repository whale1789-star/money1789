<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5日通道與動態戰略價格儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- 頂部標題與選擇區 -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-3 h-3 rounded-full bg-blue-600 animate-pulse"></span>
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">小布5日通道格儀表板</h1>
        </div>
        <p class="text-sm text-slate-500 mt-1">即時整合 5 日平均通道與根據近 20 日波動度動態計算之買賣防線</p>
      </div>

      <!-- 標的選擇 -->
      <div class="flex items-center gap-3">
        <label for="stockSelect" class="text-sm font-semibold text-slate-600 whitespace-nowrap">選擇標的：</label>
        <select id="stockSelect" onchange="changeStock(this.value)" class="bg-slate-100 hover:bg-slate-200/80 border border-slate-300 text-slate-900 text-sm font-semibold rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer">
          <option value="2330.TW" selected>台積電 (2330.TW)</option>
          <option value="3008.TW">大立光 (3008.TW)</option>
          <option value="2317.TW">鴻海 (2317.TW)</option>
          <option value="0050.TW">元大台灣50 (0050.TW)</option>
          <option value="0056.TW">元大高股息 (0056.TW)</option>
          <option value="00919.TW">群益台灣精選高息 (00919.TW)</option>
          <option value="00878.TW">國泰永續高股息 (00878.TW)</option>
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm">
        <div class="text-xs font-medium text-slate-500">最新收盤價</div>
        <div class="text-xl md:text-2xl font-bold text-blue-600 mt-1" id="kpi-close">--</div>
        <div class="text-[11px] text-slate-400 mt-0.5" id="kpi-date">基準日: --</div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-emerald-100 shadow-sm bg-emerald-50/30">
        <div class="text-xs font-semibold text-emerald-700">🛒 動態入手價</div>
        <div class="text-xl md:text-2xl font-bold text-emerald-600 mt-1" id="kpi-entry">--</div>
        <div class="text-[11px] text-emerald-700/70 mt-0.5">MA20 - 1.5SD 支撐</div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-rose-100 shadow-sm bg-rose-50/30">
        <div class="text-xs font-semibold text-rose-700">🎯 動態脫手價</div>
        <div class="text-xl md:text-2xl font-bold text-rose-600 mt-1" id="kpi-target">--</div>
        <div class="text-[11px] text-rose-700/70 mt-0.5">MA20 + 1.5SD 壓力</div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm">
        <div class="text-xs font-medium text-slate-500">5日平均高點 (上軌)</div>
        <div class="text-xl md:text-2xl font-bold text-rose-500/90 mt-1" id="kpi-avg-high">--</div>
        <div class="text-[11px] text-slate-400 mt-0.5">短期極限壓力</div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm col-span-2 md:col-span-1">
        <div class="text-xs font-medium text-slate-500">5日平均低點 (下軌)</div>
        <div class="text-xl md:text-2xl font-bold text-emerald-500/90 mt-1" id="kpi-avg-low">--</div>
        <div class="text-[11px] text-slate-400 mt-0.5">短期極限支撐</div>
      </div>
    </div>

    <!-- 戰略訊號橫幅 -->
    <div id="signalBanner" class="p-4 rounded-xl bg-blue-50 border border-blue-200 text-blue-900 text-sm font-medium flex items-center justify-between">
      <span id="signalText">🔍 分析動態訊號中...</span>
      <span class="text-xs text-slate-500" id="lastUpdatedTime">更新時間: --</span>
    </div>

    <!-- 主圖表容器 -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-800" id="chartTitle">5日通道與動態價格防線</h2>
      </div>
      <div class="relative h-[460px] w-full">
        <canvas id="channelChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    let chartInstance = null;
    let currentTicker = "2330.TW";

    // 本地即時備用資料（當尚未取得最新 JSON 時使用現實行情預載）
    const MOCK_DATA = {
      "2330.TW": {
        name: "台積電",
        dates: ["07/28", "07/29", "07/30", "07/31", "08/03", "08/04"],
        close: [2380, 2220, 2205, 2350, 2370, 2320],
        avg_high: [2395, 2390, 2380, 2370, 2385, 2375],
        avg_low: [2310, 2250, 2210, 2230, 2280, 2290],
        entry_price: 2245,
        target_price: 2510
      }
    };

    function initOrUpdateChart(stockCode, dataset) {
      const entryPrice = dataset.entry_price || 0;
      const targetPrice = dataset.target_price || 0;

      const len = dataset.dates.length;
      const entryLine = Array(len).fill(entryPrice);
      const targetLine = Array(len).fill(targetPrice);

      const lastIdx = len - 1;
      const latestClose = dataset.close[lastIdx];
      const latestHigh = dataset.avg_high[lastIdx];
      const latestLow = dataset.avg_low[lastIdx];

      document.getElementById('kpi-close').innerText = `$${latestClose.toLocaleString()}`;
      document.getElementById('kpi-date').innerText = `基準日: ${dataset.dates[lastIdx]}`;
      document.getElementById('kpi-entry').innerText = `$${entryPrice.toLocaleString()}`;
      document.getElementById('kpi-target').innerText = `$${targetPrice.toLocaleString()}`;
      document.getElementById('kpi-avg-high').innerText = `$${latestHigh.toLocaleString()}`;
      document.getElementById('kpi-avg-low').innerText = `$${latestLow.toLocaleString()}`;
      document.getElementById('chartTitle').innerText = `${dataset.name || stockCode} (${stockCode}) 5日通道與動態價格對照圖`;

      // 策略分析訊號
      const banner = document.getElementById('signalBanner');
      const signalText = document.getElementById('signalText');
      if (latestClose <= entryPrice) {
        banner.className = "p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm font-medium flex items-center justify-between";
        signalText.innerHTML = `💡 <strong>策略訊號：</strong> 當前股價 ($${latestClose}) 已落入或低於動態入手價 ($${entryPrice})，進入超賣建倉區間！`;
      } else if (latestClose >= targetPrice) {
        banner.className = "p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-900 text-sm font-medium flex items-center justify-between";
        signalText.innerHTML = `🎯 <strong>策略訊號：</strong> 當前股價 ($${latestClose}) 已達到或超越動態脫手價 ($${targetPrice})，建議分批停利！`;
      } else {
        banner.className = "p-4 rounded-xl bg-blue-50 border border-blue-200 text-blue-900 text-sm font-medium flex items-center justify-between";
        signalText.innerHTML = `📊 <strong>策略訊號：</strong> 當前股價 ($${latestClose}) 處於動態常態區間（入手價 $${entryPrice} ～ 脫手價 $${targetPrice}）。`;
      }

      const ctx = document.getElementById('channelChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dataset.dates,
          datasets: [
            {
              label: '🎯 動態脫手價 (目標賣點)',
              data: targetLine,
              borderColor: '#ef4444',
              borderWidth: 2,
              borderDash: [6, 4],
              pointRadius: 0,
              fill: false,
              tension: 0
            },
            {
              label: '🔺 前5日平均高點 (上軌)',
              data: dataset.avg_high,
              borderColor: '#f87171',
              borderWidth: 1.5,
              borderDash: [2, 2],
              pointRadius: 2,
              fill: false,
              tension: 0.2
            },
            {
              label: '💙 每日收盤價',
              data: dataset.close,
              borderColor: '#2563eb',
              backgroundColor: 'rgba(37, 99, 235, 0.08)',
              borderWidth: 3,
              pointRadius: 5,
              pointBackgroundColor: '#2563eb',
              fill: true,
              tension: 0.1
            },
            {
              label: '🔻 前5日平均低點 (下軌)',
              data: dataset.avg_low,
              borderColor: '#34d399',
              borderWidth: 1.5,
              borderDash: [2, 2],
              pointRadius: 2,
              fill: false,
              tension: 0.2
            },
            {
              label: '🛒 動態入手價 (甜蜜買點)',
              data: entryLine,
              borderColor: '#059669',
              borderWidth: 2,
              borderDash: [6, 4],
              pointRadius: 0,
              fill: false,
              tension: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: {
              position: 'top',
              labels: { font: { family: 'Inter', size: 12, weight: '500' }, usePointStyle: true, boxWidth: 8 }
            },
            tooltip: {
              padding: 12,
              backgroundColor: 'rgba(15, 23, 42, 0.9)',
              callbacks: {
                label: function(context) {
                  return ` ${context.dataset.label}: $${context.raw.toLocaleString()}`;
                }
              }
            }
          },
          scales: {
            x: { grid: { display: false } },
            y: {
              grid: { color: '#f1f5f9' },
              ticks: { callback: function(value) { return '$' + value.toLocaleString(); } }
            }
          }
        }
      });
    }

    async function fetchStockData(ticker) {
      try {
        const res = await fetch('stock_data.json?v=' + new Date().getTime());
        if (!res.ok) throw new Error("JSON 載入失敗");
        const json = await res.json();
        
        document.getElementById('lastUpdatedTime').innerText = `自動更新時間: ${json.updated_at || '最新'}`;

        if (json.stocks && json.stocks[ticker]) {
          initOrUpdateChart(ticker, json.stocks[ticker]);
          return;
        }
      } catch (err) {
        console.warn("使用預載真實盤價備援...", err);
      }

      // 若尚未載入伺服器 JSON，使用離線真實行情備援
      if (MOCK_DATA[ticker]) {
        initOrUpdateChart(ticker, MOCK_DATA[ticker]);
      }
    }

    function changeStock(ticker) {
      currentTicker = ticker;
      fetchStockData(ticker);
    }

    fetchStockData(currentTicker);
  </script>
</body>
</html>
